# .github/workflows/build.yml
#
# Verificación continua: formato, vet, análisis estático, vulnerabilidades
# conocidas, tests y build. El binario resultante se publica como artefacto
# de CI (expira a los 90 días); los releases permanentes salen de release.yml.
name: build
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "Archivos sin formatear:"; echo "$out"; exit 1
          fi
      - name: go vet
        env:
          GOOS: windows
        run: go vet ./...
      - name: Instalar linters
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: staticcheck
        env:
          GOOS: windows
        run: staticcheck ./...
      - name: govulncheck
        env:
          GOOS: windows
        run: govulncheck ./...

  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Test
        run: go test ./...
      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: go build -trimpath -ldflags="-H windowsgui -X main.agentVersion=ci-${{ github.sha }}" -o mirkkkov.exe ./cmd/agent
      - uses: actions/upload-artifact@v4
        with:
          name: mirkkkov-windows-amd64
          path: mirkkkov.exe

      # El runner de GitHub corre elevado: es el único lugar donde estos
      # caminos se ejercitan de verdad. Van con -v para que en el log se vea
      # PASS y no SKIP; sin elevación se saltan solos y no avisarían.
      - name: Tests que requieren elevación
        run: go test -count=1 -v -run "TestCopyToReadsLockedFileRaw|TestGetFileRecordReadsRealFile" ./internal/winfs/lockedfile/ ./internal/winfs/mft/

      # Escaneo real de punta a punta con el binario recién compilado: acepta
      # el consentimiento por stdin, escanea la máquina del runner, verifica la
      # cadena de custodia del reporte y muestra cómo le fue a cada colector.
      # No se exige un veredicto: la imagen del runner no es una PC de jugador.
      # Lo que sí tiene que pasar es que el escaneo termine y el reporte verifique.
      - name: Escaneo real de punta a punta
        shell: bash
        run: |
          echo si | ./mirkkkov.exe -console -out smoke-reporte.json -timeout 8m
          ./mirkkkov.exe -verify smoke-reporte.json
          python - <<'PY'
          import json, collections
          d = json.load(open("smoke-reporte.json", encoding="utf-8"))
          print("VEREDICTO:", d["verdict"]["level"], "|", d["verdict"]["summary"])
          print("ESTADO:", d["status"], "| build:", d["machine"].get("build"))
          for note in d.get("diagnostics", []):
              print("  diag:", note)
          for c in d.get("collectors", []):
              print("  colector %-16s artefactos=%-6d %6d ms  %s" % (c["name"], c["artifacts"], c["durationMs"], c.get("error", "")))
          sev = collections.Counter(f["severity"] for f in d["findings"])
          print("HALLAZGOS:", dict(sev))
          for f in d["findings"]:
              if f["severity"] not in ("INFO", "LOW"):
                  print("  [%s] %s | %s" % (f["severity"], f["title"], f["artifact"]))
          # La imagen del runner es una máquina limpia: si el veredicto deja de
          # ser LIMPIO, lo más probable es un falso positivo nuevo. Se avisa sin
          # romper el build, porque también puede haber cambiado la imagen.
          if d["verdict"]["level"] != "LIMPIO":
              print("::warning title=Escaneo real::El veredicto sobre el runner limpio es %s, no LIMPIO. Revisar falsos positivos." % d["verdict"]["level"])
          failed = [c["name"] for c in d.get("collectors", []) if c.get("error")]
          if failed:
              print("::warning title=Escaneo real::Colectores con error en el runner: %s" % ", ".join(failed))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-reporte
          path: smoke-reporte.json
