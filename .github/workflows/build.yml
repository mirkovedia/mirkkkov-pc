# .github/workflows/build.yml
#
# Verificación continua: formato, vet, análisis estático, vulnerabilidades
# conocidas, tests y build. El binario resultante se publica como artefacto
# de CI (expira a los 90 días); los releases permanentes salen de release.yml.
name: build
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "Archivos sin formatear:"; echo "$out"; exit 1
          fi
      - name: go vet
        env:
          GOOS: windows
        run: go vet ./...
      - name: Instalar linters
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: staticcheck
        env:
          GOOS: windows
        run: staticcheck ./...
      - name: govulncheck
        env:
          GOOS: windows
        run: govulncheck ./...

  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Test
        run: go test ./...
      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: go build -trimpath -ldflags="-H windowsgui -X main.agentVersion=ci-${{ github.sha }}" -o mirkkkov.exe ./cmd/agent
      - uses: actions/upload-artifact@v4
        with:
          name: mirkkkov-windows-amd64
          path: mirkkkov.exe
